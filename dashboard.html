<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TECHNEX Dashboard</title><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/logo.png">
<link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/admin.css"></head><body>
<header><span class="logo"><img src="/logo.png" alt="" width="40" height="40">TECHNEX ADMIN</span><nav style="display:flex"><a href="#" id="tOrders">Orders</a><a href="#" id="tSvc">Services</a><a href="#" id="tCm">Comments</a><button class="btn" id="out">LOGOUT</button></nav></header>
<main class="adm"><div id="stats" class="grid"></div>
<div id="orders"><div class="bar"><input id="q" placeholder="Search name or order number"><select id="fs"><option value="">All services</option></select>
<select id="fst"><option value="">All statuses</option><option>Pending</option><option>Reviewed</option><option>In Progress</option><option>Completed</option><option>Cancelled</option></select>
<select id="so"><option value="desc">Newest</option><option value="asc">Oldest</option></select></div>
<div class="tw"><table><thead><tr><th>Order</th><th>Customer</th><th>Service</th><th>Status</th><th>Date</th></tr></thead><tbody id="rows"></tbody></table></div>
<p><button class="btn" id="prev">PREV</button> <span id="pg"></span> <button class="btn" id="next">NEXT</button></p><div id="detail"></div></div>
<div id="svcs" hidden></div><div id="cm" hidden></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../assets/js/config.js"></script><script src="../assets/js/auth.js"></script><script src="../assets/js/admin.js"></script></body></html>
